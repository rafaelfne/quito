<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seu código para entrar no Quitô</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f4;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#171717;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td style="font-size:22px;font-weight:700;padding-bottom:24px;">Quitô</td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:24px;padding-bottom:16px;">Olá! Este é o seu código para entrar no Quitô:</td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 0 24px;">
                <span style="display:inline-block;font-size:36px;font-weight:700;letter-spacing:10px;background:#f5f5f4;border-radius:8px;padding:12px 20px;">{{ .Token }}</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:22px;color:#525252;padding-bottom:8px;">Volte para o app e digite estes 6 números. O código vale por 10 minutos.</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:22px;color:#525252;padding-bottom:24px;">Se não foi você quem pediu, é só ignorar este e-mail.</td>
            </tr>
            <tr>
              <td style="font-size:13px;color:#737373;border-top:1px solid #e5e5e5;padding-top:16px;">Você dá a aula. O Quitô cuida da cobrança.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

version: 1
app:
  name: quito
  private: false
tool: claude-code
agent:
  tools:
    - claude-code
    - codex
    - cursor
  default: claude-code
github:
  repo: rafaelfne/quito
  private: false
  production_branch: main
  protection: enforced
supabase:
  database: local
  local_reason: account_full
  staging:
    kind: local
    runtime: docker
  migrations: supabase/migrations
work:
  branching: feature
ai_rules:
  files:
    - AGENTS.md
    - CLAUDE.md
    - .claude/settings.json
    - .mcp.json
  enforcement: hook
tests:
  runner: vitest
  floor: 100
  diff_min: 80
guardrails:
  hooks: .githooks
  virgilio_version: 2026.1.0-beta.30
  required_checks: true
design:
  base: minimalista-moderno
  adjusted_at: 2026-11-06T04:33:51.193Z
